[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tracevoryx"
version = "0.3.0"
description = "Tracevoryx (formerly TrustWeave) - local-first cross-layer AI security and data-flow defense"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "psutil>=5.9",
    "cryptography>=42",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "pytest-timeout>=2.3", "ruff>=0.8"]

[project.scripts]
tracevoryx = "tracevoryx.cli:main"
# deprecated alias kept for 0.x; removed no earlier than 1.0
trustweave = "tracevoryx.cli:main"

[tool.setuptools.packages.find]
include = ["tracevoryx*", "trustweave*"]

[tool.setuptools.package-data]
tracevoryx = ["dashboard/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# per-test timeout; requires the pytest-timeout plugin (install with the
# `dev` extra: pip install -e ".[dev]"). Individual slow suites override
# this with explicit pytest.mark.timeout values.
timeout = 120
filterwarnings = [
    "ignore::DeprecationWarning",
    # upstream: starlette TestClient deprecates httpx1 transport (fixed upstream, not ours)
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
# E402: late imports are deliberate in this codebase (logging + optional
# sensors are imported after class definitions to avoid import cycles)
ignore = ["E402"]

[tool.ruff.lint.per-file-ignores]
"trustweave/*" = ["E501"]
