name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-validation:
    name: Source validation (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project
        run: python -m pip install -e .

      - name: Install lint and build tools
        run: python -m pip install ruff build

      - name: Lint published source
        run: python -m ruff check tracevoryx trustweave scripts benchmarks

      - name: Compile published Python source
        run: python -m compileall -q tracevoryx trustweave scripts benchmarks

      - name: Build distributions
        run: python -m build

  security-scan:
    name: Security scan
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install security tools
        run: python -m pip install pip-audit "bandit[toml]" ruff

      - name: Extract declared dependencies
        shell: python
        run: |
          import pathlib
          import tomllib

          project_file = pathlib.Path("pyproject.toml")
          config = tomllib.loads(project_file.read_text(encoding="utf-8"))
          project = config.get("project", {})

          if "dependencies" not in project:
              raise SystemExit(
                  "pyproject.toml does not declare project.dependencies. "
                  "Review dynamic dependency configuration before auditing."
              )

          dependencies = list(project["dependencies"])

          # Include declared development/test extras when available.
          optional = project.get("optional-dependencies", {})
          for group, entries in optional.items():
              print(f"Including optional dependency group: {group}")
              dependencies.extend(entries)

          if not dependencies:
              print("No third-party dependencies are declared.")

          output = pathlib.Path("tracevoryx-audit-requirements.txt")
          output.write_text(
              "\n".join(sorted(set(dependencies))) + "\n",
              encoding="utf-8",
          )
          print(f"Prepared {len(set(dependencies))} dependency declarations.")

      - name: Audit declared dependencies
        run: |
          if [ -s tracevoryx-audit-requirements.txt ]; then
            python -m pip_audit \
              --requirement tracevoryx-audit-requirements.txt \
              --strict
          else
            echo "No declared third-party dependencies to audit."
          fi
        shell: bash

      - name: Static security analysis
        run: bandit -r tracevoryx -ll --exclude tracevoryx/dashboard

      - name: Secret scan of tracked files
        shell: python
        run: |
          import pathlib
          import re
          import subprocess
          import sys

          sys.path.insert(0, ".")

          from scripts.package_release import (
              SECRET_PATTERNS,
              ALLOWLISTED_SECRET_VALUES,
          )

          result = subprocess.run(
              ["git", "ls-files"],
              capture_output=True,
              text=True,
              check=True,
          )

          hits = []

          for filename in result.stdout.splitlines():
              path = pathlib.Path(filename)

              if not path.is_file():
                  continue

              try:
                  content = path.read_text(
                      encoding="utf-8",
                      errors="ignore",
                  )
              except OSError:
                  continue

              for pattern, label in SECRET_PATTERNS:
                  for match in re.finditer(pattern, content):
                      if match.group(0) not in ALLOWLISTED_SECRET_VALUES:
                          hits.append(f"{filename}: {label}")

          if hits:
              print("Secret-like strings found:")
              print("\n".join(sorted(set(hits))))
              sys.exit(1)

          print("No secret-like strings detected in tracked files.")
